<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>WYD Chicago — what you doing tonight?</title>
    <meta
      name="description"
      content="See what's actually going on around Chicago tonight. Parties, kickbacks, concerts, games — see who's going and tap in."
    />
    <meta name="theme-color" content="#0B0B12" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/favicon.svg" />

    <!-- Open Graph / social cards -->
    <meta property="og:title" content="WYD Chicago — what you doing tonight?" />
    <meta
      property="og:description"
      content="See what's good around the city tonight 👀 Your friends are going."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Space Grotesk (display) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <!-- The whole SPA is built in JS into #app; #toast hosts transient messages. -->
    <div id="app"></div>
    <div id="toast" aria-live="polite" aria-atomic="true"></div>

    <!-- noscript fallback so the page isn't blank without JS -->
    <noscript>
      <p style="padding: 24px; color: #f5f5fa; font-family: sans-serif">
        WYD Chicago needs JavaScript turned on to show you what's good tonight.
      </p>
    </noscript>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
