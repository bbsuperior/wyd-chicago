# XcodeGen spec for WYD Chicago (iOS).
# Generate the Xcode project with:  cd ios && xcodegen generate
# See ios/README.md for full setup (Firebase SPM + GoogleService-Info.plist).

name: WYDChicago
options:
  bundleIdPrefix: app.wydchicago
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer Team ID here (or in Xcode's Signing tab):
    # DEVELOPMENT_TEAM: XXXXXXXXXX

# ---------------------------------------------------------------------------
# Firebase via Swift Package Manager.
# These are READY but commented out so the project builds against MockBackend
# with zero external dependencies. To go live:
#   1. Uncomment the `packages` block and the matching entries under
#      targets > WYDChicago > dependencies.
#   2. Re-run `xcodegen generate`.
#   3. Drop GoogleService-Info.plist into ios/WYDChicago/ (it's git-ignored).
#   4. Uncomment FirebaseApp.configure() + FirebaseBackend() in WYDChicagoApp.swift.
# ---------------------------------------------------------------------------
# packages:
#   Firebase:
#     url: https://github.com/firebase/firebase-ios-sdk.git
#     from: "11.0.0"

targets:
  WYDChicago:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: WYDChicago
    info:
      path: WYDChicago/Info.plist
      properties:
        CFBundleDisplayName: WYD Chicago
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark   # dark-first (canon §2)
        ITSAppUsesNonExemptEncryption: false
        # Custom fonts (bundle the TTFs under WYDChicago/Resources/Fonts — see README):
        UIAppFonts:
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-SemiBold.ttf
          - SpaceGrotesk-Bold.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wydchicago.ios
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    # dependencies:
    #   - package: Firebase
    #     product: FirebaseAuth
    #   - package: Firebase
    #     product: FirebaseFirestore
    #   - package: Firebase
    #     product: FirebaseStorage
